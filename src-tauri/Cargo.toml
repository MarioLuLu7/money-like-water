[package]
name = "money-like-water"
version = "0.1.5"
description = "A Windows taskbar-style usage meter for ChatGPT agentic usage."
authors = ["Money Like Water"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "money_like_water_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
reqwest = { version = "0.13.4", features = ["json"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
